<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kaushal Kishore - DevOps Engineer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-green: #00ff41;
            --dark-green: #00cc33;
            --black: #000000;
            --dark-gray: #0a0a0a;
            --card-bg: #111111;
            --glow: 0 0 20px rgba(0, 255, 65, 0.8);
            --strong-glow: 0 0 40px rgba(0, 255, 65, 1);
        }

        body {
            font-family: 'Courier New', monospace;
            background: var(--black);
            color: var(--neon-green);
            overflow-x: hidden;
            cursor: crosshair;
        }

        /* Custom Cursor */
        .cursor-dot {
            width: 8px;
            height: 8px;
            background: var(--neon-green);
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            box-shadow: var(--glow);
            transition: transform 0.1s;
        }

        .cursor-ring {
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-green);
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.3s;
        }

        /* Matrix Rain */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.15;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            padding: 20px 0;
            z-index: 1000;
            border-bottom: 2px solid var(--neon-green);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
        }

        nav .container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .logo {
            font-size: 28px;
            color: var(--neon-green);
            font-weight: bold;
            text-shadow: var(--glow);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { text-shadow: var(--glow); }
            50% { text-shadow: var(--strong-glow); }
        }

        .nav-links {
            display: flex;
            gap: 40px;
            list-style: none;
        }

        .nav-links a {
            color: var(--neon-green);
            text-decoration: none;
            transition: all 0.3s;
            position: relative;
            padding: 5px 10px;
        }

        .nav-links a::before {
            content: '[ ';
            opacity: 0;
            transition: opacity 0.3s;
        }

        .nav-links a::after {
            content: ' ]';
            opacity: 0;
            transition: opacity 0.3s;
        }

        .nav-links a:hover::before,
        .nav-links a:hover::after {
            opacity: 1;
        }

        .nav-links a:hover {
            text-shadow: var(--strong-glow);
            transform: scale(1.1);
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            flex-direction: column;
            padding-top: 70px;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0, 255, 65, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .hero-content {
            position: relative;
            z-index: 1;
        }

        /* Profile picture in hero */
        .hero-avatar {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            border: 4px solid var(--neon-green);
            box-shadow: var(--strong-glow);
            object-fit: cover;
            margin: 0 auto 25px auto;
            display: block;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .hero-content h1 {
            font-size: 5rem;
            color: var(--neon-green);
            text-shadow: var(--strong-glow);
            margin-bottom: 20px;
            animation: glitchText 5s infinite;
        }

        @keyframes glitchText {
            0%, 90%, 100% {
                transform: translate(0);
                text-shadow: var(--strong-glow);
            }
            92% {
                transform: translate(-4px, 4px);
                text-shadow: -4px 4px 0 #ff0000, 4px -4px 0 #00ff00;
            }
            94% {
                transform: translate(4px, -4px);
                text-shadow: 4px -4px 0 #ff0000, -4px 4px 0 #00ff00;
            }
        }

        .typing-text {
            font-size: 1.8rem;
            color: var(--dark-green);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .terminal-line {
            display: inline-block;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.2em;
            background: var(--neon-green);
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .cta-buttons {
            margin-top: 50px;
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 18px 50px;
            background: transparent;
            border: 3px solid var(--neon-green);
            color: var(--neon-green);
            cursor: pointer;
            font-size: 1.1rem;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: var(--neon-green);
            transition: left 0.3s;
            z-index: -1;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn:hover {
            color: var(--black);
            box-shadow: var(--strong-glow);
            transform: scale(1.05);
        }

        /* CONNECT STRIP UNDER HERO */
        .connect-strip {
            max-width: 1400px;
            margin: 0 auto 80px auto;
            padding: 0 40px;
            position: relative;
            z-index: 2;
        }

        .connect-card {
            background: rgba(0, 0, 0, 0.85);
            border: 3px solid var(--neon-green);
            box-shadow: var(--glow);
            padding: 20px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
            flex-wrap: wrap;
        }

        .connect-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .connect-avatar {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            border: 2px solid var(--neon-green);
            box-shadow: var(--glow);
            object-fit: cover;
            transition: width 0.3s ease, height 0.3s ease;
        }

        .connect-name {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .connect-tagline {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .connect-links {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .connect-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s;
            background: #050505;
        }

        .connect-link span.icon {
            font-size: 1.2rem;
        }

        .connect-link span.username {
            opacity: 0.85;
        }

        .connect-link:hover {
            box-shadow: var(--strong-glow);
            transform: translateY(-3px);
            background: var(--neon-green);
            color: var(--black);
        }

        /* Responsive adjustments */
        @media (max-width: 991px) {
            .hero-avatar {
                width: 120px;
                height: 120px;
            }
            .connect-avatar {
                width: 45px;
                height: 45px;
            }
        }

        @media (max-width: 575px) {
            .hero-avatar {
                width: 90px;
                height: 90px;
            }
            .connect-avatar {
                width: 35px;
                height: 35px;
            }
            .connect-card {
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 15px;
            }
            .connect-links {
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            nav .container {
                padding: 0 10px;
            }
            .nav-links {
                display: none;
            }
            .cta-buttons {
                flex-direction: column;
                gap: 15px;
            }
        }

        /* The rest of your styling (about, skills, certs, projects, contact, footer etc.) 
        can remain unchanged and will inherit responsiveness from container widths and grid settings */

    </style>
</head>
<body>

    <!-- Remaining sections: About, Skills, Certifications, Projects, Contact, Footer (unchanged except for responsive container styles) -->
    <!-- You can add the full remaining content here from your previous code -->

    <script>
        // JavaScript for custom cursor, loading screen, matrix effect, typing effect, scrolling etc.
        // Use your existing JS logic; here is a minimal example for cursor and matrix:

        // Loading Screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 500);
            }, 2000);
        });

        // Custom Cursor
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorRing = document.querySelector('.cursor-ring');

        document.addEventListener('mousemove', (e) => {
            cursorDot.style.left = e.clientX + 'px';
            cursorDot.style.top = e.clientY + 'px';

            setTimeout(() => {
                cursorRing.style.left = e.clientX - 17 + 'px';
                cursorRing.style.top = e.clientY - 17 + 'px';
            }, 100);
        });

        // Cursor hover animations
        document.querySelectorAll('a, button, .skill-tag, .stat-card, .cert-card, .project-card').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursorDot.style.transform = 'scale(2)';
                cursorRing.style.transform = 'scale(1.5)';
            });
            el.addEventListener('mouseleave', () => {
                cursorDot.style.transform = 'scale(1)';
                cursorRing.style.transform = 'scale(1)';
            });
        });

        // Matrix Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const fontSize = 16;
        let columns = canvas.width / fontSize;

        const drops = [];
        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff41';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 50);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            columns = canvas.width / fontSize;
        });

        // Typing Effect (use your existing texts and logic)

        // Smooth Scroll for internal links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                if (this.getAttribute('href') === '#') return;
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({
                        behavior: 'smooth',
                        block: 'start'
                    });
                }
            });
        });
    </script>
